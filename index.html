<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nook</title>
  <link rel="icon" href="NookB.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 12px black/white vertical scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #ffffff;
    }

    ::-webkit-scrollbar-thumb {
      background: #000000;
      border-radius: 6px;
    }

    /* Header Structure */
    header {
      border-bottom: 2px solid #000000;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand .logo-wide {
      height: 42px;
      width: auto;
      object-fit: contain;
    }

    .custom-titlebar {
      -webkit-app-region: drag;
      border-bottom: 2px solid #000000;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .window-controls {
      display: flex;
      gap: 10px;
      -webkit-app-region: no-drag;
    }

    .window-controls .btn {
      min-width: 42px;
      padding: 8px 12px;
    }

    .btn {
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      border-color: #000000;
      background: #ffffff;
      color: #000000;
    }

    input[type="checkbox"],
    input[type="radio"] {
      accent-color: #000000;
      width: 16px;
      height: 16px;
    }

    ::selection {
      background: #000000;
      color: #ffffff;
    }

    .modal-error {
      margin-top: 12px;
      color: #b00000;
      font-size: 12px;
      min-height: 18px;
      letter-spacing: 0.2px;
    }

    .modal-error.hidden {
      display: none;
    }

    .settings-row input,
    .settings-row select {
      border: 2px solid #000000;
      background: #000000;
      color: #ffffff;
      padding: 8px 10px;
      font-size: 13px;
      min-width: 120px;
      max-width: 180px;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      position: relative;
    }

    .settings-row select {
      background-image: linear-gradient(45deg, transparent 50%, #ffffff 50%), linear-gradient(135deg, #ffffff 50%, transparent 50%);
      background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
      background-size: 6px 6px;
      background-repeat: no-repeat;
    }

    .settings-row input:focus,
    .settings-row select:focus {
      outline: none;
      box-shadow: 4px 4px 0px #000000;
    }

    .settings-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .settings-status {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 700;
      min-height: 18px;
    }

    .settings-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .settings-actions .btn {
      padding: 8px 12px;
      font-size: 11px;
    }

    .note-actions .btn {
      flex: 0 1 auto;
      min-width: 90px;
      padding: 8px 10px;
      font-size: 11px;
    }


    /* Main Section */
    main {
      flex: 1;
      padding: 32px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .toolbar {
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toolbar-title {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .toolbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .settings-group {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #000000;
    }

    .settings-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 8px;
    }

    .settings-row label {
      white-space: nowrap;
    }

    .settings-row input,
    .settings-row select {
      border: 2px solid #000000;
      background: #ffffff;
      color: #000000;
      padding: 8px 10px;
      font-size: 13px;
      min-width: 72px;
      width: auto;
      max-width: 130px;
    }

    .settings-row input[type="number"] {
      max-width: 96px;
    }

    .settings-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .settings-status {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 700;
      min-height: 18px;
    }

    .settings-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .settings-actions .btn {
      padding: 8px 12px;
      font-size: 11px;
    }

    /* Drag & Drop Card Grid */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 24px;
    }

    .note-card {
      border: 2px solid #000000;
      padding: 20px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 220px;
      cursor: grab;
      position: relative;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, border-width 0.15s ease;
      animation: fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .note-card:hover {
      transform: translateY(-3px);
      box-shadow: 6px 6px 0px #000000;
    }

    .note-card:active {
      cursor: grabbing;
    }

    .note-card.dragging {
      opacity: 0.4;
      transform: scale(0.96);
      box-shadow: none;
    }

    .note-card.drag-over {
      border-width: 4px;
      padding: 18px;
      transform: scale(1.02);
    }

    /* Ringing Alarm State Animation */
    .note-card.ringing {
      animation: ringPulse 0.7s infinite alternate ease-in-out;
    }

    @keyframes ringPulse {
      0% {
        border-width: 2px;
        box-shadow: 0px 0px 0px #000000;
      }
      100% {
        border-width: 5px;
        box-shadow: 8px 8px 0px #000000;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .note-content {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 16px;
    }

    .note-meta {
      border-top: 1px solid #000000;
      padding-top: 12px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 16px;
      letter-spacing: 0.3px;
    }

    .note-actions {
      display: flex;
      gap: 8px;
    }

    .note-actions .btn {
      flex: 1;
      padding: 6px 0;
      font-size: 11px;
    }

    /* Smooth Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.88);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal {
      background: #ffffff;
      border: 3px solid #000000;
      padding: 32px;
      width: 100%;
      max-width: 460px;
      box-shadow: 10px 10px 0px #000000;
      transform: translateY(0);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.hidden .modal {
      transform: translateY(20px);
    }

    .modal h2 {
      font-size: 18px;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      text-transform: uppercase;
      border-bottom: 2px solid #000000;
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.8px;
    }

    .form-group textarea,
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #000000;
      background: #ffffff;
      color: #000000;
      font-size: 13px;
      outline: none;
      transition: box-shadow 0.15s ease;
    }

    .form-group textarea:focus,
    .form-group input:focus {
      box-shadow: 4px 4px 0px #000000;
    }

    .form-group textarea {
      height: 100px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    .empty-state {
      text-align: center;
      padding: 64px 0;
      border: 2px dashed #000000;
      grid-column: 1 / -1;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header class="custom-titlebar">
    <div class="brand">
      <img src="Nook.png" alt="Nook Logo" class="logo-wide">
    </div>
    <div class="window-controls">
      <button class="btn btn-secondary" id="minimize-btn" type="button">—</button>
      <button class="btn" id="close-btn" type="button">×</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="toolbar-title">便利貼列表（可按住拖動排序）</div>
      <div class="toolbar-actions">
        <button id="settings-btn" class="btn btn-secondary" type="button">設定</button>
        <button id="add-note-btn" class="btn" type="button">新增記事</button>
      </div>
    </div>

    <div class="notes-grid" id="notes-container"></div>
  </main>

  <div class="modal-overlay hidden" id="modal">
    <div class="modal">
      <h2>新增便利貼</h2>
      <div class="form-group">
        <label for="note-text">記事內容</label>
        <textarea id="note-text" placeholder="輸入事項..."></textarea>
      </div>
      <div class="form-group">
        <label for="note-time">提醒時間</label>
        <input type="datetime-local" id="note-time">
      </div>
      <div class="form-group">
        <label for="note-interval">未回應時 Spam 頻率</label>
        <div class="settings-row">
          <input type="number" id="note-interval" min="1" value="1">
          <select id="note-interval-unit">
            <option value="seconds">秒</option>
            <option value="minutes">分</option>
            <option value="hours">小時</option>
            <option value="days">天</option>
          </select>
        </div>
      </div>
      <div class="modal-error hidden" id="note-error"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" type="button" onclick="closeModal()">取消</button>
        <button class="btn" type="button" onclick="saveNote()">儲存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="settings-modal">
    <div class="modal settings-modal">
      <h2>設定</h2>
      <div class="settings-group">
        <label class="settings-label">靜音時段</label>
      <div class="settings-row">
        <label class="settings-switch">
          <input id="mute-enabled" type="checkbox">
          <span class="switch-slider"></span>
        </label>
        <span>啟用</span>
      </div>
      <div class="settings-row">
        <input id="mute-duration-value" type="number" min="1" value="30">
        <select id="mute-duration-unit">
          <option value="minutes">分鐘</option>
          <option value="hours">小時</option>
          <option value="days">天</option>
          <option value="restart">直到重複啟動後自動開啟</option>
        </select>
      </div>
    </div>
      <div class="settings-group">
        <label class="settings-label">Spam 頻率預設單位</label>
        <select id="spam-default-unit">
          <option value="seconds">秒</option>
          <option value="minutes">分</option>
          <option value="hours">小時</option>
          <option value="days">天</option>
        </select>
      </div>
      <div class="settings-group">
        <label class="settings-label">預設延後時間</label>
        <div class="settings-row">
          <input id="default-delay-value" type="number" min="1" value="5">
          <select id="default-delay-unit">
            <option value="seconds">秒</option>
            <option value="minutes">分</option>
            <option value="hours">小時</option>
            <option value="days">天</option>
          </select>
        </div>
      </div>
      <div class="settings-group">
        <label class="settings-label">開啟時自動檢查可用更新</label>
        <label class="settings-inline"><input id="auto-check-updates" type="checkbox"> 啟用</label>
      </div>
      <div class="settings-actions">
        <button class="btn" type="button" onclick="checkLatestUpdate()">檢查最新更新</button>
        <button class="btn btn-secondary" type="button" onclick="openDeleteModal()">刪除 Nook</button>
      </div>
      <div class="settings-group">
        <div class="settings-row">
          <div>目前版本：<span id="current-version">-</span></div>
          <div>最新版本：<span id="latest-version">-</span></div>
        </div>
      </div>
      <div class="settings-status" id="settings-status"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" type="button" onclick="closeSettingsModal()">取消</button>
        <button class="btn" type="button" onclick="saveSettings()">儲存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="delete-modal">
    <div class="modal">
      <h2>刪除 Nook</h2>
      <div class="form-group">
        <p>此動作會刪除類似 node_modules、dist、package-lock.json 等專案檔案，並可選擇是否保留目前設定與便籤。</p>
      </div>
      <div class="settings-group">
        <label class="settings-inline"><input id="delete-save-data" type="checkbox"> 保留目前設定與便籤</label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" type="button" onclick="closeDeleteModal()">取消</button>
        <button class="btn" type="button" onclick="confirmDeleteNook()">刪除</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = {
      notes: 'nook_notes',
      settings: 'nook_settings',
      logs: 'nook_logs'
    };

    const defaultSettings = {
      muteEnabled: false,
      muteDurationValue: 30,
      muteDurationUnit: 'minutes',
      spamDefaultUnit: 'minutes',
      defaultDelayValue: 5,
      defaultDelayUnit: 'minutes',
      autoCheckUpdates: true
    };

    let notes = JSON.parse(localStorage.getItem(STORAGE_KEYS.notes) || '[]');
    let logs = JSON.parse(localStorage.getItem(STORAGE_KEYS.logs) || '[]');
    let draggedIndex = null;
    let settings = loadSettings();
    let muteUntil = 0;
    let deleteOpenedFromSettings = false;

    function loadSettings() {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.settings) || '{}');
      return { ...defaultSettings, ...saved };
    }

    function persistSettings() {
      localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings));
      applySettingsToUi();
      appendLog('設定已更新');
    }

    function applySettingsToUi() {
      document.getElementById('mute-enabled').checked = settings.muteEnabled;
      document.getElementById('mute-duration-value').value = settings.muteDurationValue;
      document.getElementById('mute-duration-unit').value = settings.muteDurationUnit;
      document.getElementById('spam-default-unit').value = settings.spamDefaultUnit;
      document.getElementById('default-delay-value').value = settings.defaultDelayValue;
      document.getElementById('default-delay-unit').value = settings.defaultDelayUnit;
      document.getElementById('auto-check-updates').checked = settings.autoCheckUpdates;
    }

    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(() => updatePermButton());
      }
    }

    function updatePermButton() {
      const btn = document.getElementById('perm-btn');
      if (!btn) return;
      if (window.electronAPI) {
        btn.textContent = '系統通知：系統級啟用';
        btn.style.background = '#000000';
        btn.style.color = '#ffffff';
      } else if (!('Notification' in window)) {
        btn.textContent = '不支援通知';
        btn.disabled = true;
      } else if (Notification.permission === 'granted') {
        btn.textContent = '通知權限：已啟用';
        btn.style.background = '#000000';
        btn.style.color = '#ffffff';
      } else {
        btn.textContent = '允許通知權限';
      }
    }

    function openModal() {
      document.getElementById('note-text').value = '';
      document.getElementById('note-error').textContent = '';
      document.getElementById('note-error').classList.add('hidden');
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset() + 5);
      document.getElementById('note-time').value = now.toISOString().slice(0, 16);
      document.getElementById('note-interval').value = 1;
      document.getElementById('note-interval-unit').value = settings.spamDefaultUnit;
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function saveNote() {
      const text = document.getElementById('note-text').value;
      const trimmedText = text.trim();
      const timeVal = document.getElementById('note-time').value;
      const intervalValue = parseInt(document.getElementById('note-interval').value, 10);
      const intervalUnit = document.getElementById('note-interval-unit').value;
      const errorEl = document.getElementById('note-error');

      if (trimmedText === '' || !timeVal || isNaN(intervalValue) || intervalValue < 1) {
        errorEl.textContent = '請完整填寫所有欄位';
        errorEl.classList.remove('hidden');
        return;
      }

      errorEl.textContent = '';
      errorEl.classList.add('hidden');

      notes.push({
        id: Date.now().toString(),
        text: trimmedText,
        targetTime: new Date(timeVal).getTime(),
        intervalValue,
        intervalUnit,
        intervalMinutes: convertToMinutes(intervalValue, intervalUnit),
        lastNotifiedTime: null,
        status: 'pending'
      });
      persistAndRender();
      appendLog(`新增便籤: ${trimmedText}`);
      closeModal();
    }

    function openSettingsModal() {
      settings = loadSettings();
      applySettingsToUi();
      document.getElementById('settings-status').textContent = '';
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function openDeleteModal() {
      deleteOpenedFromSettings = true;
      closeSettingsModal();
      document.getElementById('delete-save-data').checked = false;
      document.getElementById('delete-modal').classList.remove('hidden');
    }

    function closeDeleteModal() {
      document.getElementById('delete-modal').classList.add('hidden');
      if (deleteOpenedFromSettings) {
        deleteOpenedFromSettings = false;
        openSettingsModal();
      }
    }

    function confirmDeleteNook() {
      const saveData = document.getElementById('delete-save-data').checked;
      if (!saveData) {
        localStorage.removeItem(STORAGE_KEYS.notes);
        localStorage.removeItem(STORAGE_KEYS.settings);
        localStorage.removeItem(STORAGE_KEYS.logs);
      }
      if (window.electronAPI?.deleteApp) {
        window.electronAPI.deleteApp({ saveSettingsAndNotes: saveData, data: { notes, settings, logs } });
      } else {
        window.alert('此環境無法直接刪除執行檔');
      }
      closeDeleteModal();
    }

    function saveSettings() {
      settings = {
        muteEnabled: document.getElementById('mute-enabled').checked,
        muteDurationValue: parseInt(document.getElementById('mute-duration-value').value, 10) || 30,
        muteDurationUnit: document.getElementById('mute-duration-unit').value,
        spamDefaultUnit: document.getElementById('spam-default-unit').value,
        defaultDelayValue: parseInt(document.getElementById('default-delay-value').value, 10) || 5,
        defaultDelayUnit: document.getElementById('default-delay-unit').value,
        autoCheckUpdates: document.getElementById('auto-check-updates').checked
      };
      persistSettings();
      applyMuteState();
      if (window.electronAPI?.setAutoUpdateEnabled) {
        window.electronAPI.setAutoUpdateEnabled(settings.autoCheckUpdates);
      }
      closeSettingsModal();
    }

    function applyMuteState() {
      if (!settings.muteEnabled) {
        muteUntil = 0;
        return;
      }
      if (settings.muteDurationUnit === 'restart') {
        muteUntil = Number.MAX_SAFE_INTEGER;
      } else {
        muteUntil = Date.now() + getDurationMs(settings.muteDurationValue, settings.muteDurationUnit);
      }
    }

    function markComplete(id) {
      notes = notes.filter(n => n.id !== id);
      appendLog(`完成便籤: ${id}`);
      persistAndRender();
    }

    function snoozeNote(id) {
      const note = notes.find(n => n.id === id);
      if (note) {
        const delayMs = getDurationMs(settings.defaultDelayValue, settings.defaultDelayUnit);
        note.targetTime = Date.now() + delayMs;
        note.status = 'pending';
        note.lastNotifiedTime = null;
        appendLog(`延後便籤: ${note.id}`);
        persistAndRender();
      }
    }

    function persistAndRender() {
      localStorage.setItem(STORAGE_KEYS.notes, JSON.stringify(notes));
      localStorage.setItem(STORAGE_KEYS.logs, JSON.stringify(logs));
      renderNotes();
    }

    function appendLog(message) {
      logs.push(`[${new Date().toLocaleString()}] ${message}`);
      localStorage.setItem(STORAGE_KEYS.logs, JSON.stringify(logs));
    }

    function renderNotes() {
      const container = document.getElementById('notes-container');
      container.innerHTML = '';

      if (notes.length === 0) {
        container.innerHTML = '<div class="empty-state">尚無記事</div>';
        return;
      }

      notes.forEach((note, index) => {
        const card = document.createElement('div');
        card.className = `note-card ${note.status === 'ringing' ? 'ringing' : ''}`;
        card.draggable = true;
        card.dataset.index = index;

        const dateStr = new Date(note.targetTime).toLocaleString();
        const intervalText = formatInterval(note.intervalValue || 1, note.intervalUnit || settings.spamDefaultUnit || 'minutes');

        card.innerHTML = `
          <div class="note-content">${escapeHtml(note.text)}</div>
          <div>
            <div class="note-meta">
              <span>目標時間: ${dateStr}</span>
              <span>重複間隔: ${intervalText}</span>
            </div>
            <div class="note-actions">
              <button class="btn" type="button" onclick="markComplete('${note.id}')">完成</button>
              <button class="btn btn-secondary" type="button" onclick="snoozeNote('${note.id}')">延後</button>
            </div>
          </div>
        `;

        card.addEventListener('dragstart', (e) => {
          draggedIndex = index;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.note-card').forEach(c => c.classList.remove('drag-over'));
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          card.classList.add('drag-over');
        });

        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });

        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const targetIndex = parseInt(card.dataset.index, 10);
          if (draggedIndex !== null && draggedIndex !== targetIndex) {
            const movedItem = notes.splice(draggedIndex, 1)[0];
            notes.splice(targetIndex, 0, movedItem);
            persistAndRender();
          }
        });

        container.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[match]));
    }

    function getDurationMs(value, unit) {
      const n = parseInt(value, 10) || 1;
      const map = { seconds: 1000, minutes: 60 * 1000, hours: 60 * 60 * 1000, days: 24 * 60 * 60 * 1000 };
      return n * (map[unit] || map.minutes);
    }

    function convertToMinutes(value, unit) {
      const map = { seconds: 1 / 60, minutes: 1, hours: 60, days: 24 * 60 };
      return value * (map[unit] || map.minutes);
    }

    function formatInterval(value, unit) {
      const label = { seconds: '秒', minutes: '分', hours: '小時', days: '天' }[unit] || '分';
      return `${value}${label}`;
    }

    function isMuteActive() {
      if (!settings.muteEnabled) return false;
      if (settings.muteDurationUnit === 'restart') return true;
      return Date.now() < muteUntil;
    }

    function checkReminders() {
      const now = Date.now();
      let changed = false;

      if (isMuteActive()) return;

      notes.forEach(note => {
        if (note.status === 'done') return;

        const isDue = now >= note.targetTime;
        if (isDue) {
          const intervalMs = getDurationMs(note.intervalValue || 1, note.intervalUnit || settings.spamDefaultUnit || 'minutes');
          const shouldNotify = !note.lastNotifiedTime || (now - note.lastNotifiedTime >= intervalMs);

          if (shouldNotify) {
            triggerNotification(note);
            note.lastNotifiedTime = now;
            note.status = 'ringing';
            changed = true;
          }
        }
      });

      if (changed) {
        persistAndRender();
      }
    }

    function triggerNotification(note) {
      if (window.electronAPI) {
        window.electronAPI.sendNotification({ title: 'NOOK 提醒', body: note.text });
      } else if ('Notification' in window && Notification.permission === 'granted') {
        const notification = new Notification('NOOK 提醒', { body: note.text, icon: 'NookB.png', tag: note.id, requireInteraction: true });
        notification.onclick = () => window.focus();
      }
    }

    async function checkLatestUpdate() {
      const statusEl = document.getElementById('settings-status');
      const currentVersionEl = document.getElementById('current-version');
      const latestVersionEl = document.getElementById('latest-version');
      statusEl.textContent = '正在檢查最新更新...';

      let currentVersion = '-';
      if (window.electronAPI?.getAppVersion) {
        currentVersion = await window.electronAPI.getAppVersion();
        currentVersionEl.textContent = currentVersion;
      }

      if (!window.electronAPI?.compareVersionToGithub) {
        statusEl.textContent = '目前無法檢查更新';
        return;
      }

      const result = await window.electronAPI.compareVersionToGithub();
      if (!result.success) {
        statusEl.textContent = `檢查更新失敗：${result.error || '未知錯誤'}`;
        return;
      }

      const latestVersion = result.latestVersion || '-';
      latestVersionEl.textContent = latestVersion;
      if (currentVersion === '-') {
        statusEl.textContent = `最新版本：${latestVersion}`;
        return;
      }

      if (result.needsUpdate) {
        statusEl.textContent = `目前版本 ${currentVersion}，最新版本 ${latestVersion}，建議更新`;
      } else {
        statusEl.textContent = `目前版本 ${currentVersion}，最新版本 ${latestVersion}，已是最新版本`;
      }
    }

    document.getElementById('minimize-btn').addEventListener('click', () => window.electronAPI?.minimizeWindow());
    document.getElementById('close-btn').addEventListener('click', () => window.electronAPI?.closeWindow());

    document.getElementById('settings-btn').addEventListener('click', openSettingsModal);
    document.getElementById('add-note-btn').addEventListener('click', openModal);

    updatePermButton();
    applySettingsToUi();
    applyMuteState();
    renderNotes();
    setInterval(checkReminders, 3000);
  </script>
</body>
</html>
